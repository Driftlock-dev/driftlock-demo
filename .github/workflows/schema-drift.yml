name: Check API Schema Drift

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  driftlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Driftlock-dev/driftlock@v0.1.3
        with:
          contract: driftlock.contract.json
          payload: tests/fixtures/latest_webhook.json
